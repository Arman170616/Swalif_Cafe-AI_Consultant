# Plain HTTP just redirects to HTTPS — Chrome/most browsers auto-upgrade bare-IP/typed
# navigations to https:// anyway, so leaving 80 to actually serve content behind a
# self-signed cert on 443 would mean some visits silently hang until they time out.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Self-signed — there's no domain pointed at this droplet yet, so a CA-trusted cert
    # (Let's Encrypt et al.) isn't obtainable for a bare IP. This still encrypts traffic;
    # browsers will show a one-time "connection not private" warning to click through.
    # Swap for a real cert + `certbot` once a domain is pointed here.
    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    # Proxied straight through to the Django/DRF backend container — same origin as
    # the SPA, so no CORS configuration is needed in production at all.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin — used for user/role management, IP whitelist and activity logs.
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000/static/;
    }

    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
